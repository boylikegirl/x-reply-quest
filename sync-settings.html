<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地文件同步 · X Reply Quest</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app sync-panel">
    <h1>同步到插件文件夹</h1>
    <p>点击“选择记录文件”，在保存窗口进入插件文件夹，文件名保留 history.json，然后保存。只授权这个 JSON 文件，无需授权整个文件夹。</p>
    <p>在浏览器扩展管理页查看插件加载路径，在保存窗口进入该目录，文件名使用 history.json。</p>
    <p>如果浏览器仍提示该位置受保护，请改用普通数据文件夹。插件无法强制写入被浏览器禁止的位置。重新启动后如权限失效，请重新授权。</p>
    <div class="actions">
      <button id="chooseDirectory" type="button">选择记录文件</button>
      <button id="authorizeDirectory" type="button" disabled>重新授权</button>
    </div>
    <label><input id="autoSync" type="checkbox" disabled> 自动同步</label>
    <div class="actions"><button id="syncNow" type="button" disabled>立即同步</button></div>
    <p id="directoryLabel"></p>
    <p id="settingsStatus" role="status" aria-live="polite">读取中…</p>
    <p>关闭同步会保留已有文件。文件只包含插件当前记录，清空今日也会更新到文件；修改文件不会反向修改插件数据。</p>
  </main>
  <script src="file-sync-storage.js"></script>
  <script src="sync-settings.js"></script>
</body>
</html>
